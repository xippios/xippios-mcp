name: Docker

on:
  pull_request:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: build
        id: build
        env:
          EVENT: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=""
          if [ "${EVENT}" = "workflow_run" ]; then
            if [ "${RUN_EVENT}" != "push" ] && [ "${RUN_EVENT}" != "workflow_dispatch" ]; then
              echo "::error title=image::Publish ran on ${RUN_EVENT:-no event}, not on a push or a dispatch, so nothing is built"
              exit 1
            fi
            published="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == "publish") | .conclusion')"
            if [ "${published}" = "success" ]; then
              version="$(python3 -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
              tagged="$(git ls-remote origin "refs/tags/v${version}^{}" | cut -f1)"
              if [ "${tagged}" != "$(git rev-parse HEAD)" ]; then
                echo "::error title=image::v${version} does not name the commit built, so no image is published"
                exit 1
              fi
            fi
          fi
          tags=(--tag xippios-mcp:ci)
          labels=(--label "org.opencontainers.image.source=https://github.com/xippios/xippios-mcp"
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)")
          if [ -n "${version}" ]; then
            tags+=(--tag "ghcr.io/xippios/xippios-mcp:${version}")
            labels+=(--label "org.opencontainers.image.version=${version}")
          fi
          docker build "${tags[@]}" "${labels[@]}" .
          echo "image=${version:+ghcr.io/xippios/xippios-mcp:${version}}" >> "${GITHUB_OUTPUT}"
      - name: smoke
        id: smoke
        run: |
          docker run --rm xippios-mcp:ci --help
          read_token="$(openssl rand -hex 32)"
          write_token="$(openssl rand -hex 32)"
          echo "::add-mask::${read_token}"
          echo "::add-mask::${write_token}"
          config="${RUNNER_TEMP}/host.toml"
          cat > "${config}" <<'TOML'
          [endpoints.sources]
          packages = ["faostat", "cashctrl", "usda-esr"]
          token_env = "XIPPIOS_MCP_SOURCES_TOKEN"

          [endpoints.cashctrl-write]
          packages = ["cashctrl:write"]
          token_env = "XIPPIOS_MCP_CASHCTRL_WRITE_TOKEN"
          TOML
          chmod 644 "${config}"
          trap 'docker logs xippios-mcp-smoke || true; docker rm --force xippios-mcp-smoke || true' EXIT
          XIPPIOS_MCP_SOURCES_TOKEN="${read_token}" \
          XIPPIOS_MCP_CASHCTRL_WRITE_TOKEN="${write_token}" \
            docker run --detach --name xippios-mcp-smoke --publish 127.0.0.1:8000:8000 \
              --volume "${config}:/etc/xippios-mcp/host.toml:ro" \
              --env XIPPIOS_MCP_SOURCES_TOKEN --env XIPPIOS_MCP_CASHCTRL_WRITE_TOKEN \
              xippios-mcp:ci
          initialize='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"docker-smoke","version":"0"}}}'
          for endpoint in sources cashctrl-write; do
            headers="${RUNNER_TEMP}/${endpoint}.headers"
            status="$(curl --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
              --max-time 10 --output /dev/null --dump-header "${headers}" \
              --write-out '%{http_code}' --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json, text/event-stream' \
              --data "${initialize}" "http://127.0.0.1:8000/${endpoint}/mcp")" || {
              echo "::error::/${endpoint}/mcp did not answer; the server's log follows"
              exit 1
            }
            if [ "${status}" != "401" ]; then
              echo "::error::/${endpoint}/mcp answered ${status} to a request without a token, not 401"
              exit 1
            fi
            if ! grep -qi '^www-authenticate: Bearer realm="xippios-mcp"' "${headers}"; then
              echo "::error::/${endpoint}/mcp answered 401 without the bearer's challenge"
              exit 1
            fi
            echo "/${endpoint}/mcp: 401 with the bearer's challenge"
          done
      - name: publish
        id: publish
        if: steps.build.outputs.image != ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "${TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}"
          docker logout ghcr.io
