name: Docker

on:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag xippios-mcp:ci .
      - name: The image answers --help
        run: docker run --rm xippios-mcp:ci --help
